# 1. Persistent Volume & Claim for NAS (Docker Desktop Volume mapping)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gokso-nas-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  # Di Docker Desktop, volume docker tersimpan di VM internal /var/lib/docker/volumes/
  hostPath:
    path: /var/lib/docker/volumes/nas/_data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gokso-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---

# 2. PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokso-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokso-db
  template:
    metadata:
      labels:
        app: gokso-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: "goksodb"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "Sci$iK50"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: gokso-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gokso-db-service
spec:
  selector:
    app: gokso-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---

# 3. Application Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokso-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokso-app
  template:
    metadata:
      labels:
        app: gokso-app
    spec:
      containers:
      - name: gokso
        image: absolutezero24/gokso:latest
        imagePullPolicy: Always
        env:
        - name: APP_PORT
          value: "9001"
        - name: APP_AUTO_MIGRATE
          value: "true"
        - name: DB_HOST
          value: "gokso-db-service"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "Sci$iK50"
        - name: DB_NAME
          value: "goksodb"
        - name: DB_PORT
          value: "5432"
        ports:
        - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: gokso-service
spec:
  selector:
    app: gokso-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9001
---

# 4. Ingress Controller Configuration
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gokso-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: gokso.scisi.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gokso-service
            port:
              number: 80
