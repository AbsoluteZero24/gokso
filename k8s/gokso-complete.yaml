# 1. Penyimpanan Data untuk Database
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gokso-db-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: "/mnt/k8s-pool/gokso"
    server: 192.168.100.106
  mountOptions:
    - nfsvers=4.1
    - noatime
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gokso-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# 2. Database PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokso-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokso-db
  template:
    metadata:
      labels:
        app: gokso-db
    spec:
      securityContext:
        fsGroup: 999
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: PGDATA
          value: /var/lib/postgresql/nfs_data/pgdata
        - name: POSTGRES_DB
          value: "goksodb"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "Sci$iK50"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/nfs_data
          subPath: data-db
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: gokso-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gokso-db-service
spec:
  selector:
    app: gokso-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
# 3. Go Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokso-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokso-backend
  template:
    metadata:
      labels:
        app: gokso-backend
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox
        command: ['sh', '-c', 'until nc -z gokso-db-service 5432; do echo waiting for db; sleep 2; done;']
      containers:
      - name: backend
        image: absolutezero24/gokso-backend:latest
        imagePullPolicy: Always
        env:
        - name: APP_PORT
          value: "9001"
        - name: APP_AUTO_MIGRATE
          value: "true"
        - name: DB_HOST
          value: "gokso-db-service"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "Sci$iK50"
        - name: DB_NAME
          value: "goksodb"
        - name: DB_PORT
          value: "5432"
        ports:
        - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: gokso-backend-service
spec:
  type: LoadBalancer
  selector:
    app: gokso-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9001
---
# 4. Frontend React
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokso-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokso-frontend
  template:
    metadata:
      labels:
        app: gokso-frontend
    spec:
      containers:
      - name: frontend
        image: absolutezero24/gokso-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "http://gokso.scisi.com/api"
        - name: VITE_API_URL
          value: "http://gokso.scisi.com/api"
---
apiVersion: v1
kind: Service
metadata:
  name: gokso-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: gokso-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# 5. Mobile Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokso-mobile
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokso-mobile
  template:
    metadata:
      labels:
        app: gokso-mobile
    spec:
      containers:
      - name: mobile
        image: absolutezero24/gokso-mobile:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gokso-mobile-service
spec:
  type: LoadBalancer
  selector:
    app: gokso-mobile
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gokso-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: gokso.scisi.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: gokso-backend-service
            port:
              number: 80
      - path: /public
        pathType: Prefix
        backend:
          service:
            name: gokso-backend-service
            port:
              number: 80
      - path: /mobile
        pathType: Prefix
        backend:
          service:
            name: gokso-mobile-service
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gokso-frontend-service
            port:
              number: 80