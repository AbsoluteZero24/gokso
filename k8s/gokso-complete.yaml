# 1. Penyimpanan Data untuk Database
apiVersion: v1
kind: PersistentVolume
metadata:
  name: gokso-db-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    path: "/mnt/kubernetes-pool/kubernetes/gokso/db"
    server: 192.168.100.106
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gokso-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# 2. Database PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokso-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokso-db
  template:
    metadata:
      labels:
        app: gokso-db
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_DB
          value: "goksodb"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "Sci$iK50"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: db-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: db-storage
        persistentVolumeClaim:
          claimName: gokso-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: gokso-db-service
spec:
  selector:
    app: gokso-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
# 3. Go Backend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokso-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokso-backend
  template:
    metadata:
      labels:
        app: gokso-backend
    spec:
      containers:
      - name: backend
        image: absolutezero24/gokso-backend:latest
        imagePullPolicy: Always
        env:
        - name: APP_PORT
          value: "9001"
        - name: DB_HOST
          value: "gokso-db-service"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "Sci$iK50"
        - name: DB_NAME
          value: "goksodb"
        - name: DB_PORT
          value: "5432"
        ports:
        - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: gokso-backend-service
spec:
  type: LoadBalancer
  selector:
    app: gokso-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9001
---
# 4. Frontend React
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokso-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokso-frontend
  template:
    metadata:
      labels:
        app: gokso-frontend
    spec:
      containers:
      - name: frontend
        image: absolutezero24/gokso-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gokso-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: gokso-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# 5. Mobile Deployment
