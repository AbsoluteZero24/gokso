apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokso-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokso-frontend
  template:
    metadata:
      labels:
        app: gokso-frontend
    spec:
      containers:
      - name: frontend
        image: absolutezero24/gokso-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: REACT_APP_API_URL
          value: "http://192.168.100.121"
        - name: VITE_API_URL
          value: "http://192.168.100.121"
---
apiVersion: v1
kind: Service
metadata:
  name: gokso-frontend-service
spec:
  selector:
    app: gokso-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
